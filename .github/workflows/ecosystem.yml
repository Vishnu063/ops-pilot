name: Unified ecosystem acceptance
on:
  push:
    branches: [feat/unified-devops-engineer]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_ecosystem.py -v
      - run: python -m compileall -q ops_pilot
      - name: Parse incident desk JavaScript
        run: |
          python -c 'from pathlib import Path; s=Path("ops_pilot/ecosystem.html").read_text(); Path("/tmp/ecosystem.js").write_text(s.split("<script>")[1].split("</script>")[0])'
          node --check /tmp/ecosystem.js
  live-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops-pilot
      - uses: actions/checkout@v4
        with:
          repository: Vishnu063/cloudlaunch
          ref: 8850415c1cea22a49764c8a349932c7b95359324
          path: cloudlaunch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Vishnu063/devops_platform
          ref: d4389c23d80a5730781da4bbd7bdefa249dc6ebc
          path: devops_platform
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Vishnu063/devops-troubleshooting-labs
          ref: 1c8b192c30cbda515b0f3c5e5b2887602dbadef6
          path: labs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./ops-pilot
      - name: Real failure, authenticated alert, approval, repair and verified recovery
        run: python labs/ecosystem/acceptance.py --allow-disposable-host --cloudlaunch cloudlaunch --platform devops_platform --ops-pilot ops-pilot --output ecosystem-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-ecosystem-evidence
          path: ecosystem-evidence/
          if-no-files-found: ignore
