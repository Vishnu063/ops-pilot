name: Validate Ops Pilot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Shell and Python syntax
        run: |
          bash -n start.sh
          python -m compileall -q ops_pilot tests
      - name: Dashboard JavaScript syntax
        run: |
          python -c 'from pathlib import Path; s=Path("ops_pilot/dashboard.html").read_text(); Path("/tmp/dashboard.js").write_text(s.split("<script>")[1].split("</script>")[0])'
          node --check /tmp/dashboard.js
  docker-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Test actual stopped containers and failed recovery
        env:
          OPS_PILOT_DOCKER_LAB: '1'
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_docker_lab.py -v 2>&1 | tee docker-lab-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-evidence
          path: docker-lab-results.txt
          if-no-files-found: ignore
          retention-days: 30
