name: Validate Ops Pilot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Installed CLI and setup smoke
        run: python scripts/installation_smoke.py
      - name: Shell and Python syntax
        run: |
          bash -n start.sh scripts/install-service.sh
          python -m compileall -q ops_pilot tests
      - name: Dashboard JavaScript syntax
        run: |
          python -c 'from pathlib import Path; s=Path("ops_pilot/dashboard.html").read_text(); Path("/tmp/dashboard.js").write_text(s.split("<script>")[1].split("</script>")[0])'
          node --check /tmp/dashboard.js
          python -c 'from pathlib import Path; s=Path("ops_pilot/freelance.html").read_text(); Path("/tmp/freelance.js").write_text(s.split("<script>")[1].split("</script>")[0])'
          node --check /tmp/freelance.js
          python scripts/check-freelance-workflow.py
  docker-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Test actual stopped containers and failed recovery
        env:
          OPS_PILOT_DOCKER_LAB: '1'
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_docker_lab.py -v 2>&1 | tee docker-lab-results.txt
      - name: Actual generated bundle practice deployment
        env:
          OPS_PILOT_GENERATED_LAB: '1'
        run: python -m unittest discover -s tests -p test_generated_bundle_lab.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-evidence
          path: |
            docker-lab-results.txt
            generated-lab-evidence.json
          if-no-files-found: ignore
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile approval/recovery acceptance
        run: |
          python tests/browser_acceptance.py
          python tests/freelance_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            browser-evidence/
            freelance-evidence/
          if-no-files-found: ignore
          retention-days: 30
  service-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install .
      - name: Actual systemd detached start and crash recovery
        env:
          OPS_PILOT_SERVICE_LAB: '1'
        run: |
          set -o pipefail
          .venv/bin/python scripts/service_smoke.py 2>&1 | tee service-lab-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-lab-evidence
          path: service-lab-results.txt
          if-no-files-found: ignore
          retention-days: 30
  n8n-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install . playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Disposable n8n test runtime
        run: npm install --prefix /tmp/ops-n8n --legacy-peer-deps --omit=optional --no-audit --no-fund n8n@2.44.6
      - name: Real authenticated n8n form and ZIP journey
        env:
          N8N_EXECUTABLE: /tmp/ops-n8n/node_modules/n8n/bin/n8n
        run: python tests/n8n_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-evidence
          path: n8n-evidence/
          if-no-files-found: ignore
          retention-days: 30
