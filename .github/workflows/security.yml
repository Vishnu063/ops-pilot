name: Security boundaries
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development-only source scanner
        run: python -m pip install . bandit==1.8.6
      - name: Scan production Python for medium-or-higher confident findings
        run: |
          python - <<'PYCODE'
          import subprocess, sys
          from pathlib import Path
          import triage
          subprocess.run([sys.executable, '-m', 'bandit', '-r', 'ops_pilot', str(Path(triage.__file__).parent), '-ll', '-ii', '-f', 'json', '-o', 'security-results.json'], check=True)
          PYCODE
      - name: Verify immutable native-engine dependency
        run: |
          python - <<'PY'
          import re,tomllib
          from pathlib import Path
          project=tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert len(project['dependencies'])==1
          assert re.fullmatch(r'devops-triage-assistant @ https://github.com/Vishnu063/devops-triage-assistant/archive/[0-9a-f]{40}\.zip',project['dependencies'][0])
          print('Native engine remains pinned to an exact immutable source commit. This is not a vulnerability-clearance claim.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-security-evidence
          path: security-results.json

  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reviewed runtime in a separate virtual environment
        run: |
          python -m venv /tmp/ops-pilot-runtime-audit
          /tmp/ops-pilot-runtime-audit/bin/python -m pip install --upgrade pip
          /tmp/ops-pilot-runtime-audit/bin/python -m pip install .
          /tmp/ops-pilot-runtime-audit/bin/python -m pip check
      - name: Record complete installed runtime inventory and first-party source scope
        run: /tmp/ops-pilot-runtime-audit/bin/python scripts/dependency_audit.py --output-directory dependency-audit
      - name: Install the development-only vulnerability scanner outside the runtime
        run: python -m pip install pip-audit==2.9.0
      - name: Audit every indexed runtime distribution without vulnerability suppressions
        run: python -m pip_audit --strict --no-deps --disable-pip --requirement dependency-audit/requirements.txt --format json --output dependency-audit/vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-evidence
          path: dependency-audit/
          if-no-files-found: error
