# Optional separate n8n for Linux/EC2. Does not replace an existing installation.
# Host networking reaches the loopback-only Ops Pilot bridge. No Docker socket mount.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    network_mode: host
    restart: unless-stopped
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: '5680'
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5680
      WEBHOOK_URL: http://localhost:5680/
      N8N_SECURE_COOKIE: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/setup-freelance.py first}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
    volumes:
      - freelance_n8n_data:/home/node/.n8n
volumes:
  freelance_n8n_data:
