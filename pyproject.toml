[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-pilot"
version = "0.2.0"
description = "A focused Docker incident workflow with reviewed repairs and application verification"
requires-python = ">=3.11"
dependencies = ["devops-triage-assistant @ https://github.com/Vishnu063/devops-triage-assistant/archive/c87d3f6cc985d20d3950a4369e037542dd99113e.zip"]

[project.scripts]
ops-pilot = "ops_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["ops_pilot*"]

[tool.setuptools.package-data]
ops_pilot = ["dashboard.html", "freelance.html", "ecosystem.html", "diagnostics.html"]

