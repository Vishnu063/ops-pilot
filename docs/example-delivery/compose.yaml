services:
  app:
    image: "example/synthetic-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    labels:
      io.ops-pilot.job: 87c85873b6a5
    ports:
      - "127.0.0.1:${OPS_PILOT_HOST_PORT:-8080}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
